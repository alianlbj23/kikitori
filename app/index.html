<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>kikitori</title>
    <link rel="stylesheet" href="/src/styles/main.css" />
    <script type="module" src="/src/main/main.ts"></script>
  </head>
  <body>
    <!-- Visible text comes from src/locales via data-i18n* attributes (lib/i18n.ts applyStatic). -->
    <div class="app">
      <aside class="rail">
        <header class="brand">
          <span class="brand-mark" lang="ja">聞き取り</span>
          <span class="brand-name">kikitori</span>
        </header>

        <section class="rail-block" aria-labelledby="mode-heading">
          <h2 id="mode-heading" class="rail-heading" data-i18n="rail.mode"></h2>
          <div class="modes" role="radiogroup" aria-labelledby="mode-heading">
            <button type="button" class="mode" role="radio" data-mode="media" aria-checked="true">
              <span class="mode-name" data-i18n="mode.media.name"></span>
              <span class="mode-note" data-mode-note="media"></span>
            </button>
            <button type="button" class="mode" role="radio" data-mode="interpret" aria-checked="false">
              <span class="mode-name" data-i18n="mode.interpret.name"></span>
              <span class="mode-note" data-mode-note="interpret"></span>
            </button>
          </div>
        </section>

        <section class="rail-block">
          <label class="rail-heading" for="device" data-i18n="rail.device"></label>
          <select id="device" class="rail-select"></select>
          <p class="rail-hint" id="device-hint"></p>
        </section>

        <button type="button" id="start" class="start" data-state="idle"></button>

        <nav class="nav" data-i18n-aria-label="nav.label">
          <button type="button" class="nav-item" data-page="transcript" aria-current="page" data-i18n="nav.transcript"></button>
          <button type="button" class="nav-item" data-page="models" data-i18n="nav.models"></button>
          <button type="button" class="nav-item" data-page="settings" data-i18n="nav.settings"></button>
        </nav>

        <footer class="engine" aria-live="polite">
          <p class="engine-status"><span class="dot" id="status-dot" data-tone="busy"></span><span id="status-label"></span></p>
          <p class="engine-detail" id="status-detail" hidden></p>
          <button type="button" class="link-button" id="restart-engine" data-i18n="engine.restart" hidden></button>
        </footer>
      </aside>

      <main class="content">
        <div class="notices" id="notices" aria-live="assertive"></div>

        <!-- Models missing for the chosen languages are downloaded when Start is pressed (lib/start-downloads.ts). -->
        <section class="start-downloads" id="start-downloads" aria-labelledby="startdl-heading" hidden>
          <h2 id="startdl-heading" data-i18n="startdl.title"></h2>
          <ul class="startdl-items" id="startdl-items"></ul>
          <p class="startdl-message" id="startdl-message" role="status" aria-live="polite"></p>
          <div class="form-actions">
            <button type="button" class="primary" id="startdl-retry" data-i18n="startdl.retry" hidden></button>
            <button type="button" class="ghost" id="startdl-cancel" data-i18n="startdl.cancel" data-i18n-title="startdl.cancelLabel" hidden></button>
          </div>
        </section>

        <section class="page" id="page-transcript" aria-labelledby="transcript-heading">
          <header class="page-head">
            <div>
              <h1 id="transcript-heading" data-i18n="transcript.title"></h1>
              <p class="page-lede" data-i18n="transcript.lede"></p>
            </div>
            <div class="page-tools">
              <label class="switch"><input type="checkbox" id="overlay-visible" /><span data-i18n="transcript.overlayVisible"></span></label>
              <label class="switch"><input type="checkbox" id="overlay-click-through" /><span data-i18n="transcript.clickThrough"></span></label>
              <label class="switch"><input type="checkbox" id="show-translation" checked /><span data-i18n="transcript.showTranslation"></span></label>
              <button type="button" class="ghost" id="clear-transcript" data-i18n="transcript.clear"></button>
              <!-- Export (lib/export.ts builds the file, Rust transcript_save writes it). -->
              <details class="export-menu" id="export-menu">
                <summary data-i18n="export.button"></summary>
                <div class="export-panel">
                  <label for="export-content" data-i18n="export.content"></label>
                  <select id="export-content">
                    <option value="both" data-i18n="export.contentBoth"></option>
                    <option value="original" data-i18n="export.contentOriginal"></option>
                    <option value="translation" data-i18n="export.contentTranslation"></option>
                  </select>
                  <div class="export-formats" id="export-formats"></div>
                  <p class="field-help" id="export-help" data-i18n="export.help"></p>
                </div>
              </details>
            </div>
          </header>
          <p class="shortcut-note" id="shortcut-note"></p>
          <ol class="transcript" id="transcript" aria-live="off"></ol>
          <div class="empty" id="transcript-empty">
            <p class="empty-title" data-i18n="transcript.emptyTitle"></p>
            <p data-i18n="transcript.emptyBody"></p>
          </div>
        </section>

        <section class="page" id="page-models" aria-labelledby="models-heading" hidden>
          <header class="page-head">
            <div>
              <h1 id="models-heading" data-i18n="models.title"></h1>
              <p class="page-lede" data-i18n="models.lede"></p>
            </div>
            <div class="page-tools">
              <button type="button" class="ghost" id="models-refresh" data-i18n="models.refresh"></button>
            </div>
          </header>

          <section class="block" aria-labelledby="hw-heading">
            <h2 id="hw-heading" data-i18n="hw.title"></h2>
            <dl class="facts" id="hardware"></dl>
            <ul class="notes" id="hardware-errors" hidden></ul>
          </section>

          <section class="block" aria-labelledby="rec-heading">
            <h2 id="rec-heading" data-i18n="rec.title"></h2>
            <div id="recommendation"></div>
          </section>

          <section class="block" aria-labelledby="gpu-heading">
            <h2 id="gpu-heading" data-i18n="gpu.title"></h2>
            <p class="block-lede" data-i18n="gpu.lede"></p>
            <div id="gpu-runtime"></div>
          </section>

          <section class="block" aria-labelledby="asr-heading">
            <h2 id="asr-heading" data-i18n="asr.title"></h2>
            <p class="block-lede" data-i18n="asr.lede"></p>
            <table class="models">
              <thead>
                <tr>
                  <th scope="col" data-i18n="asr.colModel"></th>
                  <th scope="col" data-i18n="asr.colSize"></th>
                  <th scope="col" data-i18n="asr.colSpeed"></th>
                  <th scope="col" data-i18n="asr.colMemory"></th>
                  <th scope="col" data-i18n="asr.colLicense"></th>
                  <th scope="col" data-i18n="asr.colStatus"></th>
                </tr>
              </thead>
              <tbody id="asr-models"></tbody>
            </table>
          </section>

          <section class="block" aria-labelledby="tr-heading">
            <h2 id="tr-heading" data-i18n="tr.title"></h2>
            <p class="block-lede" id="tr-source"></p>
            <ul class="presets" id="tr-presets"></ul>
          </section>

          <section class="block" aria-labelledby="combo-heading">
            <h2 id="combo-heading" data-i18n="combo.title"></h2>
            <p class="block-lede" data-i18n="combo.lede"></p>
            <form id="combo-form" novalidate>
              <div class="field-row">
                <div class="field">
                  <label for="c-fast-model" data-i18n="combo.fastModel"></label>
                  <select id="c-fast-model" name="fast_model"></select>
                  <p class="field-error" data-error-for="fast_model"></p>
                </div>
                <div class="field">
                  <label for="c-final-model" data-i18n="combo.finalModel"></label>
                  <select id="c-final-model" name="final_model"></select>
                  <p class="field-error" data-error-for="final_model"></p>
                </div>
              </div>
              <div class="field">
                <label for="c-device" data-i18n="combo.device"></label>
                <select id="c-device" name="device">
                  <option value="auto" data-i18n="combo.deviceAuto"></option>
                  <option value="cpu" data-i18n="combo.deviceCpu"></option>
                  <option value="cuda" data-i18n="combo.deviceCuda"></option>
                </select>
                <p class="field-help" data-i18n="combo.deviceHelp"></p>
                <p class="field-error" data-error-for="device"></p>
              </div>
              <div class="field-row">
                <div class="field">
                  <label for="c-tr-fast" data-i18n="combo.translationFast"></label>
                  <input id="c-tr-fast" name="translation_fast" list="tr-names" autocomplete="off" spellcheck="false" />
                  <p class="field-error" data-error-for="translation_fast"></p>
                </div>
                <div class="field">
                  <label for="c-tr-final" data-i18n="combo.translationFinal"></label>
                  <input id="c-tr-final" name="translation_final" list="tr-names" autocomplete="off" spellcheck="false" />
                  <p class="field-error" data-error-for="translation_final"></p>
                </div>
              </div>
              <datalist id="tr-names"></datalist>

              <details class="advanced">
                <summary data-i18n="combo.advanced"></summary>
                <p class="field-help" data-i18n="combo.advancedHelp"></p>
                <div class="field-row">
                  <div class="field">
                    <label for="c-fast-ct" data-i18n="combo.fastComputeType"></label>
                    <select id="c-fast-ct" name="fast_compute_type"></select>
                    <p class="field-error" data-error-for="fast_compute_type"></p>
                  </div>
                  <div class="field">
                    <label for="c-final-ct" data-i18n="combo.finalComputeType"></label>
                    <select id="c-final-ct" name="final_compute_type"></select>
                    <p class="field-error" data-error-for="final_compute_type"></p>
                  </div>
                </div>
                <div class="field-row">
                  <div class="field">
                    <label for="c-fast-threads" data-i18n="combo.fastThreads"></label>
                    <input id="c-fast-threads" name="fast_cpu_threads" inputmode="numeric" data-i18n-placeholder="common.auto" autocomplete="off" />
                    <p class="field-error" data-error-for="fast_cpu_threads"></p>
                  </div>
                  <div class="field">
                    <label for="c-final-threads" data-i18n="combo.finalThreads"></label>
                    <input id="c-final-threads" name="final_cpu_threads" inputmode="numeric" data-i18n-placeholder="common.auto" autocomplete="off" />
                    <p class="field-error" data-error-for="final_cpu_threads"></p>
                  </div>
                </div>
                <div class="field">
                  <label for="c-cuda-dirs" data-i18n="combo.cudaDirs"></label>
                  <textarea id="c-cuda-dirs" name="cuda_library_dirs" rows="3" spellcheck="false" data-i18n-placeholder="combo.cudaDirsPlaceholder"></textarea>
                  <p class="field-help" data-i18n="combo.cudaDirsHelp"></p>
                  <p class="field-error" data-error-for="cuda_library_dirs"></p>
                </div>
              </details>

              <div class="check" id="combo-check" role="status" aria-live="polite"></div>
              <div class="form-actions">
                <button type="submit" class="primary" id="combo-save" data-i18n="combo.save"></button>
                <button type="button" class="ghost" id="combo-reset" data-i18n="combo.reset"></button>
                <span class="form-status" id="combo-status" role="status"></span>
              </div>
            </form>
          </section>
        </section>

        <section class="page" id="page-settings" aria-labelledby="settings-heading" hidden>
          <header class="page-head">
            <div>
              <h1 id="settings-heading" data-i18n="settings.title"></h1>
              <p class="page-lede" id="settings-path"></p>
            </div>
          </header>

          <!-- Outside the settings form: the interface language is saved and applied as soon as it changes. -->
          <fieldset class="block">
            <legend data-i18n="settings.uiLocaleLegend"></legend>
            <div class="field-row">
              <div class="field">
                <label for="f-ui-locale" data-i18n="settings.uiLocaleLabel"></label>
                <select id="f-ui-locale"></select>
                <p class="field-help" data-i18n="settings.uiLocaleHelp"></p>
              </div>
            </div>
          </fieldset>

          <!-- Its own form: saving languages can also switch to the recommended models (lib/languages.ts). -->
          <form id="languages-form" novalidate>
            <fieldset class="block">
              <legend data-i18n="settings.languageLegend"></legend>
              <p class="block-lede" data-i18n="settings.languageLede"></p>
              <p class="field-help" id="languages-mode-note"></p>
              <div class="field-row">
                <div class="field" id="field-source">
                  <label for="f-source" data-i18n="settings.source"></label>
                  <input type="search" class="lang-filter" id="f-source-filter" data-filter-for="source" data-i18n-placeholder="settings.languageFilter" autocomplete="off" spellcheck="false" />
                  <select id="f-source" name="source"></select>
                  <p class="field-help" data-i18n="settings.sourceHelp"></p>
                  <p class="field-error" data-error-for="source"></p>
                </div>
                <div class="field" id="field-target">
                  <label for="f-target" id="label-target"></label>
                  <input type="search" class="lang-filter" id="f-target-filter" data-filter-for="target" data-i18n-placeholder="settings.languageFilter" autocomplete="off" spellcheck="false" />
                  <select id="f-target" name="target"></select>
                  <p class="field-help" id="help-target"></p>
                  <p class="field-error" data-error-for="target"></p>
                </div>
                <div class="field" id="field-partner">
                  <label for="f-partner" data-i18n="settings.partner"></label>
                  <input type="search" class="lang-filter" id="f-partner-filter" data-filter-for="partner" data-i18n-placeholder="settings.languageFilter" autocomplete="off" spellcheck="false" />
                  <select id="f-partner" name="partner"></select>
                  <p class="field-help" data-i18n="settings.partnerHelp"></p>
                  <p class="field-error" data-error-for="partner"></p>
                </div>
              </div>
              <div class="language-preview" id="language-preview" role="status" aria-live="polite"></div>
              <div class="field">
                <label class="consent" for="f-apply-recommended">
                  <input id="f-apply-recommended" name="apply_recommended" type="checkbox" checked />
                  <span data-i18n="settings.applyRecommended"></span>
                </label>
                <p class="field-help" data-i18n="settings.applyRecommendedHelp"></p>
              </div>
              <div class="form-actions">
                <button type="submit" class="primary" id="languages-save" data-i18n="settings.saveLanguages"></button>
                <span class="form-status" id="languages-status" role="status"></span>
              </div>
            </fieldset>
          </form>

          <form id="settings-form" novalidate>
            <fieldset class="block">
              <legend data-i18n="settings.translationLegend"></legend>
              <p class="block-lede" data-i18n="settings.translationLede"></p>
              <div class="field">
                <label for="f-base-url" data-i18n="settings.baseUrl"></label>
                <input id="f-base-url" name="base_url" type="url" autocomplete="off" spellcheck="false" />
                <p class="field-error" data-error-for="base_url"></p>
              </div>
              <div class="field">
                <label for="f-api-key-env" data-i18n="settings.apiKeyEnv"></label>
                <input id="f-api-key-env" name="api_key_env" autocomplete="off" spellcheck="false" />
                <p class="field-help" data-i18n="settings.apiKeyEnvHelp"></p>
                <p class="field-error" data-error-for="api_key_env"></p>
              </div>
              <p class="field-help" data-i18n="settings.translationModelsHelp"></p>
              <!-- Shown when the translation server cannot be reached (lib/translation-guide.ts). -->
              <div class="guide" id="translation-guide" role="status" hidden>
                <p id="translation-guide-text"></p>
                <div class="form-actions">
                  <button type="button" class="primary" id="guide-install" data-i18n="guide.install"></button>
                  <button type="button" class="ghost" id="guide-original" data-i18n="guide.originalOnly"></button>
                  <button type="button" class="ghost" id="guide-recheck" data-i18n="guide.recheck"></button>
                </div>
              </div>
            </fieldset>

            <fieldset class="block">
              <legend data-i18n="settings.regionLegend"></legend>
              <p class="block-lede" data-i18n="settings.regionLede"></p>
              <div class="field">
                <label class="consent" for="f-allow-restricted">
                  <input id="f-allow-restricted" name="allow_restricted" type="checkbox" />
                  <span data-i18n="settings.regionConsent"></span>
                </label>
                <p class="field-help" data-i18n="settings.regionHelp"></p>
                <p class="field-error" data-error-for="allow_restricted"></p>
              </div>
            </fieldset>

            <fieldset class="block">
              <legend data-i18n="settings.styleLegend"></legend>
              <!-- No name: applied at once (session.set_translation / settings.set), not with "儲存設定". -->
              <div class="field">
                <label class="switch" for="f-show-translation">
                  <input id="f-show-translation" type="checkbox" checked />
                  <span data-i18n="settings.showTranslation"></span>
                </label>
                <p class="field-help" data-i18n="settings.showTranslationHelp"></p>
              </div>
              <div class="preview" id="style-preview" aria-hidden="true">
                <div class="preview-line">
                  <span class="preview-orig" lang="ja" data-i18n="settings.previewOriginal"></span>
                  <span class="preview-tr" data-i18n="settings.previewTranslation"></span>
                </div>
              </div>
              <div class="field-row">
                <div class="field">
                  <label for="f-font-size"><span data-i18n="settings.fontSize"></span> <output id="o-font-size"></output></label>
                  <input id="f-font-size" name="font_size" type="range" min="14" max="96" step="1" />
                  <p class="field-error" data-error-for="font_size"></p>
                </div>
                <div class="field">
                  <label for="f-opacity"><span data-i18n="settings.opacity"></span> <output id="o-opacity"></output></label>
                  <input id="f-opacity" name="background_opacity_percent" type="range" min="0" max="100" step="5" />
                  <p class="field-error" data-error-for="background_opacity_percent"></p>
                </div>
              </div>
              <div class="field-row">
                <div class="field">
                  <label for="f-position" data-i18n="settings.position"></label>
                  <select id="f-position" name="position">
                    <option value="bottom" data-i18n="settings.positionBottom"></option>
                    <option value="top" data-i18n="settings.positionTop"></option>
                  </select>
                  <p class="field-error" data-error-for="position"></p>
                </div>
                <div class="field">
                  <label for="f-lines" data-i18n="settings.lines"></label>
                  <select id="f-lines" name="max_lines">
                    <option value="1" data-i18n="settings.linesOption" data-i18n-count="1"></option>
                    <option value="2" data-i18n="settings.linesOption" data-i18n-count="2"></option>
                    <option value="3" data-i18n="settings.linesOption" data-i18n-count="3"></option>
                  </select>
                  <p class="field-error" data-error-for="max_lines"></p>
                </div>
              </div>
              <!-- Reading rhythm of the overlay (lib/rhythm.ts). -->
              <div class="field-row">
                <div class="field">
                  <label for="f-min-display" data-i18n="settings.minDisplay"></label>
                  <input id="f-min-display" name="min_display_secs" type="number" min="0" max="10" step="0.5" inputmode="decimal" />
                  <p class="field-help" data-i18n="settings.minDisplayHelp"></p>
                  <p class="field-error" data-error-for="min_display_secs"></p>
                </div>
                <div class="field">
                  <label for="f-idle-clear" data-i18n="settings.idleClear"></label>
                  <input id="f-idle-clear" name="idle_clear_secs" type="number" min="0" max="600" step="1" inputmode="numeric" />
                  <p class="field-help" data-i18n="settings.idleClearHelp"></p>
                  <p class="field-error" data-error-for="idle_clear_secs"></p>
                </div>
              </div>
            </fieldset>

            <fieldset class="block">
              <legend data-i18n="output.legend"></legend>
              <div class="field">
                <label class="consent" for="f-auto-save">
                  <input id="f-auto-save" name="auto_save_transcripts" type="checkbox" />
                  <span data-i18n="output.autoSave"></span>
                </label>
                <p class="field-help" data-i18n="output.autoSaveHelp"></p>
                <p class="field-help" id="transcripts-path"></p>
                <p class="field-error" data-error-for="auto_save_transcripts"></p>
                <div class="form-actions">
                  <button type="button" class="ghost" id="open-transcripts" data-i18n="output.openTranscripts"></button>
                </div>
              </div>
              <div class="field">
                <label for="f-obs-output" data-i18n="output.obs"></label>
                <select id="f-obs-output" name="obs_output">
                  <option value="off" data-i18n="output.obsOff"></option>
                  <option value="original" data-i18n="output.obsOriginal"></option>
                  <option value="translation" data-i18n="output.obsTranslation"></option>
                  <option value="both" data-i18n="output.obsBoth"></option>
                </select>
                <p class="field-help" data-i18n="output.obsHelp"></p>
                <p class="field-help" id="obs-path"></p>
                <p class="field-error" data-error-for="obs_output"></p>
                <div class="form-actions">
                  <button type="button" class="ghost" id="open-obs" data-i18n="output.openObs"></button>
                </div>
              </div>
            </fieldset>

            <div class="form-actions">
              <button type="submit" class="primary" id="settings-save" data-i18n="settings.save"></button>
              <span class="form-status" id="settings-status" role="status"></span>
            </div>
          </form>

          <section class="block" aria-labelledby="about-heading">
            <h2 id="about-heading" data-i18n="about.title"></h2>
            <p id="about-version"></p>
            <p id="about-engine" class="rail-hint"></p>
            <p id="about-license"></p>
            <p class="about-notice" data-i18n="about.notice"></p>
            <p id="about-third-party" class="rail-hint"></p>
            <div class="form-actions">
              <button type="button" class="ghost" id="open-app-licenses" data-i18n="about.openAppLicenses" hidden></button>
              <button type="button" class="ghost" id="open-engine-licenses" data-i18n="about.openEngineLicenses" hidden></button>
              <button type="button" class="ghost" id="check-update" data-i18n="about.checkUpdate"></button>
              <span class="form-status" id="update-status" role="status"></span>
            </div>
            <p class="rail-hint" data-i18n="about.diagnosticsHelp"></p>
            <div class="form-actions">
              <button type="button" class="ghost" id="copy-diagnostics" data-i18n="about.copyDiagnostics"></button>
              <span class="form-status" id="diagnostics-status" role="status"></span>
            </div>
            <!-- Shown only when the clipboard cannot be written: the user copies by hand. -->
            <textarea class="diagnostics-text" id="diagnostics-text" rows="12" readonly spellcheck="false" hidden></textarea>
          </section>
        </section>
      </main>
    </div>
  </body>
</html>
