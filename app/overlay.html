<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>kikitori</title>
    <link rel="stylesheet" href="/src/styles/overlay.css" />
    <script type="module" src="/src/overlay/overlay.ts"></script>
  </head>
  <body>
    <!-- Visible text comes from src/locales via data-i18n attributes (lib/i18n.ts applyStatic). -->
    <div class="frame" id="frame" data-position="bottom">
      <div class="handle" id="handle">
        <span class="handle-grip" aria-hidden="true"></span>
        <span class="handle-label" data-i18n="overlay.drag"></span>
        <button type="button" class="handle-button" id="hide" data-i18n="overlay.hide"></button>
      </div>
      <div class="stage" id="stage">
        <!-- v0.3 G6: frozen by the pause shortcut / recent final lines on demand; G3: "say that again". -->
        <p class="badge" id="paused" data-i18n="overlay.paused" hidden></p>
        <div class="history" id="history" hidden>
          <p class="history-title" data-i18n="overlay.history"></p>
          <div class="history-lines" id="history-lines"></div>
        </div>
        <p class="notice" id="notice" role="status" hidden></p>
        <div class="lines" id="lines" aria-live="polite"></div>
        <p class="hint" id="hint" data-i18n="overlay.hint"></p>
      </div>
      <div class="resize" id="resize" aria-hidden="true"></div>
    </div>
  </body>
</html>
