# 測試：任何分支的 push 與 pull request 都跑；release.yml 也以 workflow_call 重用它。
# 設計說明見 docs/specs/packaging-ci.md。第三方 action 一律釘在完整 commit SHA（註解是對應的版本）。
name: test

on:
  push:
  pull_request:
  workflow_call:

# 只需要讀原始碼；沒有任何步驟要寫回 repo、建立 release 或讀 secrets。
permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Windows runner 的管線預設編碼不是 UTF-8；測試與腳本會印出中文。
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8
  # 與本機開發相同的 uv 版本（uv.lock 由它產生）。
  UV_VERSION: "0.13.4"

jobs:
  python:
    name: python (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macos-latest 是 Apple Silicon（arm64）。
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies (locked)
        run: uv sync --locked

      - name: Unit tests
        run: uv run python -m unittest discover -s tests

      - name: Lint
        run: uv run ruff check

      - name: Version numbers in sync
        run: uv run python scripts/sync_version.py check

  engine-bundle:
    # 每個平台建置 PyInstaller 引擎（one-folder），再對建好的執行檔跑冒煙測試：
    # --self-check（原生函式庫與資料檔）+ 假模式的 stdio 協定。
    name: engine bundle (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies (locked)
        run: uv sync --locked

      - name: Build and smoke-test kikitori-engine
        env:
          KIKITORI_BUILD_NONINTERACTIVE: "1"
        # --no-sidecar：這裡只驗證引擎；放進 app/src-tauri/binaries/ 由 Tauri 的 job 負責。
        run: uv run python packaging/engine/build.py --no-sidecar --smoke

  # Tauri 前端與 Rust 的檢查在 app.yml。
